# E5-TS stage 2 (proposed): KD fine-tuning, 2 epochs. The final KD recipe
# (e4_kd_wnone: 0.5 CE + 0.5 top-20 bucket KD on the teacher's soft labels, uniform
# token weights), started from the stage-1 relation adapter instead of a fresh LoRA.
# No relation loss and no teacher in the loop, so one GPU is enough. Optimizer and LR
# schedule start fresh, as in a fine-tuning phase.
#   python -m ie643.distill.two_stage --config configs/e5ts_stage2_kd.yaml \
#       --init-adapter runs/e5ts/stage1/seed643/final
#   -> runs/e5ts/kd/seed643/final (the E5-TS student)
exp: e5ts
variant: kd
student: Qwen/Qwen2.5-VL-3B-Instruct
kd:
  enabled: true
  alpha: 0.5
  tau: 1.0
  div: fkl
  skew: 0.1
  weight: none
rel:
  enabled: false
lora:
  r: 16
  alpha: 32
  dropout: 0.05
optim:
  lr: 1.0e-4
  epochs: 2
  micro_batch: 4
  grad_accum: 8
  seed: 643
data:
  dataset_weighting: true
  weight_power: 0.5
  max_length: 4096
