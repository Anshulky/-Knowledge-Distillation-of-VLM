# E5a: MiniLMv2 Q/K/V relations. Micro-batch 1 because relation maps are large and
# gradient checkpointing is off while the Q/K/V hooks need a gradient.
# Effective batch stays 32 (1 x 32).
exp: e5
variant: main
student: Qwen/Qwen2.5-VL-3B-Instruct
teacher: Qwen/Qwen3-VL-32B-Instruct
student_device: cuda:0
teacher_device: cuda:1
kd:
  enabled: false
rel:
  enabled: true
  beta: 1.0
  relation_heads: 32
  student_layer: 36
  teacher_layer: 48
  pre_rope: true
  mask_sinks: true
  sink_ratio: 10.0
  causal: true
  image_columns: true
  resize: B
lora:
  r: 16
  alpha: 32
  dropout: 0.05
optim:
  lr: 1.0e-4
  epochs: 2
  micro_batch: 1
  grad_accum: 32
  seed: 643
data:
  dataset_weighting: true
  weight_power: 0.5
  max_length: 4096
