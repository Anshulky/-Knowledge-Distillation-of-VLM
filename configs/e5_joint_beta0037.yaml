# E5-joint, beta = 0.037 (not adopted). Same as e5_joint_beta1.yaml except beta, which
# is the median |grad CE| / |grad rel| from the gradient probe (e5_joint_probe.yaml), so
# both terms get an equal share of each update. Fixed from training data before any
# evaluation.
#   python -m ie643.distill train --config configs/e5_joint_beta0037.yaml
exp: e5
variant: beta0037
student: Qwen/Qwen2.5-VL-3B-Instruct
teacher: Qwen/Qwen3-VL-32B-Instruct
student_device: cuda:0
teacher_device: cuda:1
kd:
  enabled: false
rel:
  enabled: true
  beta: 0.037
  relation_heads: 32
  student_layer: 36
  teacher_layer: 48
  pre_rope: true
  mask_sinks: true
  sink_ratio: 10.0
  causal: true
  image_columns: true
  resize: B
lora:
  r: 16
  alpha: 32
  dropout: 0.05
optim:
  lr: 1.0e-4
  epochs: 2
  micro_batch: 1
  grad_accum: 32
  seed: 643
data:
  dataset_weighting: true
  weight_power: 0.5
  max_length: 4096
