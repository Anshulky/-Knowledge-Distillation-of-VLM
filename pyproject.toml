[project]
name = "ie643"
version = "0.1.0"
description = "Receipt and bill OCR distillation (Qwen3-VL teacher, Qwen2.5-VL student)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "gradio>=6.29.0",
    "matplotlib>=3.11.2",
    "numpy>=2.0",
    "pandas>=2.0",
    "pillow>=11.0",
    "pyarrow>=17.0",
    "transformers>=5.17.0",
    "vllm",
]

[project.scripts]
ie643-preprocess = "ie643.preprocess.cli:main"
ie643-pack = "ie643.pack.cli:main"
ie643-teacher = "ie643.teacher.cli:main"
ie643-review = "ie643.review.cli:main"
ie643-splits = "ie643.splits.cli:main"
ie643-eval = "ie643.eval.cli:main"
ie643-rollout = "ie643.rollout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
